<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heisei Gal Business Advisor 認可コールバック</title>
<style>
  :root {
    --paper: #eef0ea;
    --ink: #1e2b27;
    --ink-soft: #4b5750;
    --rule: #c9d0c4;
    --rule-strong: #a9b3a1;
    --accent: #9c5f2e;
    --accent-soft: #e7d9c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141f1b;
      --ink: #e9efe8;
      --ink-soft: #a8b5ac;
      --rule: #2b3a34;
      --rule-strong: #3a4b43;
      --accent: #d89a5d;
      --accent-soft: #3a2f22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  .card {
    max-width: 560px;
    width: 100%;
    margin: 24px;
    padding: 36px;
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--ink-soft); margin: 0 0 20px; font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--ink);
    background: var(--accent-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-family: inherit;
    color: var(--paper);
    background: var(--accent);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="card">
    <h1>認可コールバック</h1>
    <p>下のテキストボックスの内容をすべてコピーして、ターミナルに貼り付けてください。</p>
    <textarea id="url-box" readonly></textarea>
    <div>
      <button id="copy-btn">コピー</button>
      <span class="status" id="status"></span>
    </div>
  </div>
  <script>
    document.getElementById('url-box').value = window.location.href;
    document.getElementById('copy-btn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        document.getElementById('status').textContent = 'コピーしました';
      } catch (e) {
        document.getElementById('status').textContent = 'コピーに失敗しました。手動で選択してコピーしてください。';
      }
    });
  </script>
</body>
</html>
